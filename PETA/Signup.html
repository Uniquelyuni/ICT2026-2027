            Gender

                name="r1"
                value="Male"
                class="input"
            >

            <input
                type="radio"
                name="r1"
                value="Female"
                class="input"
            >
            Female


            <br>
            <br>


            Country

            <select
                name="country"
                class="input"
            >

                <option>Country</option>
                <option>Spain</option>
                <option>Japan</option>
                <option>Philippines</option>

            </select>


            <br>
            <br>


            E-mail

            <input
                type="text"
                name="email"
                placeholder="Enter E-mail"
                class="input"
            >


            <br>
            <br>


            Phone

            <input
                type="text"
                name="phone"
                maxlength="15"
                placeholder="Enter Phone"
                class="input"
            >


            <br>
            <br>


            Password

            <input
                type="password"
                name="password"
                maxlength="12"
                class="input"
            >


            <br>
            <br>

                type="password"
                name="confirmpassword"

            <br>


            <input
                type="checkbox"
                name="c1"
            >

                type="submit"
                class="yes"
            >
