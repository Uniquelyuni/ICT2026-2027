<!DOCTYPE html>
<html>

<head>

    <title>Registration Form</title>

    <link rel="stylesheet" href="external.css" type="text/css">

</head>


<body>


    <!-- Navigation -->

    <details class="sidebar">

        <summary>☰</summary>

        <nav>

            <a href="homepage.html" class="home-link">Homepage</a>

            <a href="Signup.html">Sign Up</a>

    <!-- Registration Form -->

    <form>

        <h2>Registration Form</h2>

        <hr color="#8391A3">


        <table>

            <tr>

                <td>Enter Name</td>

                <td>
                    <input type="text" name="name">
                </td>

            </tr>


            <tr>

                <td>Enter Password</td>

                <td>
                    <input type="password" name="password">
                </td>

            </tr>


            <tr>

                <td>Enter Address</td>

                <td>
                    <textarea></textarea>
                </td>

            </tr>


            <tr>

                <td>Select Game</td>

                <td>

                    <label>
                        <input
                            type="checkbox"
                            name="game"
                            value="Hockey"
                        >
                        Hockey
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            name="game"
                            value="Football"
                        >
                        Football
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            name="game"
                            value="Badminton"
                        >
                        Badminton
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            name="game"
                            value="Cricket"
                        >
                        Cricket
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            name="game"
                            value="Volleyball"
                        >
                        Volleyball
                    </label>

                </td>

            </tr>


            <tr>

                <td>Gender</td>

                <td>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male"
                            checked
                        >
                        Male
                    </label>


                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female"
                        >
                        Female
                    </label>

                </td>

            </tr>


            <tr>

                <td>Select your age</td>

                <td>

                    <select name="age">

                        <option value="">Select</option>

                        <option>13</option>
                        <option>14</option>
                        <option>15</option>
                        <option>16</option>
                        <option>17</option>
                        <option>18</option>
                        <option>19</option>
                        <option>20</option>

                        <option>24</option>

                        <option>26</option>

                        <option>28</option>
                        <option>29</option>
                        <option>30</option>
                        <option>31</option>
                        <option>32</option>
                        <option>33</option>
                        <option>34</option>
                        <option>35</option>
                        <option>36</option>
                        <option>37</option>
                        <option>38</option>
                        <option>39</option>

                        <option>60</option>

                        <option>62</option>
                        <option>63</option>
                        <option>64</option>
                        <option>65</option>

                    </select>

                </td>

            </tr>


            <tr>

                <td>Select Photo</td>

                <td>
                    <input type="file" name="photo">
                </td>

            </tr>


            <tr>

                <td colspan="2">

                    <input
                        type="button"
                        value="Click"
                    >

                    <input type="reset">

                    <input type="submit">

                </td>

            </tr>

        </table>
