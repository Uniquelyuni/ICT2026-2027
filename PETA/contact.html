<!DOCTYPE html>
<html>

<head>

    <title>Contact Form</title>

    <link rel="stylesheet" href="external.css" type="text/css">

</head>


<body class="contact-page">


    <!-- Navigation -->

    <details class="sidebar">

        <summary>☰</summary>

        <nav>

            <a href="index.html" class="home-link">Homepage</a>

            <a href="Registration.html">Registration Form</a>

            <a href="Signup.html">Sign Up</a>

            <a href="signin.html">Sign In</a>

        </nav>

    </details>


    <!-- Contact Form -->

    <table>

        <tr>

            <td>

                <h1>Contact Us!</h1>


                <p class="description">
                    Have a question or concern? Send us a message and let us know.
                </p>


                <form
                    name="Contact Form"
                    method="post"
                >

                    <input
                        type="text"
                        name="Name"
                        placeholder="Your Name..."
                        required
                    >


                    <input
                        type="email"
                        name="Email"
                        placeholder="Your Email..."
                        required
                    >


                    <input
                        type="text"
                        name="Subject"
                        placeholder="Subject..."
                    >


                    <textarea
                        name="Message"
                        placeholder="Write your message here..."
                    ></textarea>


                    <button type="submit">
                        Send Message
                    </button>

                </form>

            </td>

        </tr>

    </table>


</body>

</html>
