<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="external.css">
</head>
<body class="signup-page">

    <!-- Navigation -->
    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="menu-button" aria-label="Open navigation">☰</label>

    <nav class="sidebar">
        <a href="index.html">Homepage</a>
        <a href="registration.html">Registration</a>
        <a href="contact.html">Contact Us</a>
        <a href="signin.html">Sign In</a>
    </nav>

    <main>
        <section class="simple-card signup-card">
            <h1>Sign Up</h1>
            <hr class="signin-divider">

            <form>
                <div class="signup-row">
                    <label for="first-name">First Name</label>
                    <input id="first-name" type="text" name="first-name" placeholder="First Name" required>
                </div>

                <div class="signup-row">
                    <label for="last-name">Last Name</label>
                    <input id="last-name" type="text" name="last-name" placeholder="Last Name" required>
                </div>

                <div class="signup-row">
                    <label for="date-of-birth">Date of Birth</label>
                    <input id="date-of-birth" type="date" name="date-of-birth" min="1961-01-01" max="2013-12-31" required>
                </div>

                <div class="inline-row">
                    <span>Gender</span>
                    <label><input type="radio" name="signup-gender" value="Male" required> Male</label>
                    <label><input type="radio" name="signup-gender" value="Female"> Female</label>

                    <span class="country-label">Country</span>
                    <select name="country" required>
                        <option value="" selected disabled>Country</option>
                        <option>Philippines</option>
                        <option>United States</option>
                        <option>Canada</option>
                        <option>United Kingdom</option>
                        <option>South Korea</option>
                        <option>Japan</option>
                        <option>China</option>
                        <option>Australia</option>
                        <option>Singapore</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="signup-row">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" name="email" placeholder="Enter E-mail" required>
                </div>

                <div class="signup-row">
                    <label for="phone">Phone</label>
                    <input id="phone" type="tel" name="phone" placeholder="Enter Phone" required>
                </div>

                <div class="signup-row">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" required>
                </div>

                <div class="signup-row">
                    <label for="confirm-password">Confirm Password</label>
                    <input id="confirm-password" type="password" name="confirm-password" required>
                </div>

                <label class="terms">
                    <input type="checkbox" name="terms" required>
                    I Agree to the Terms of Use
                </label>

                <button type="submit" class="wide-button">Submit</button>
                <button type="reset" class="wide-button">Cancel</button>
            </form>
        </section>
    </main>

</body>
</html>
