<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="external.css">
</head>
<body class="registration-page">

    <!-- Navigation -->
    <input type="checkbox" id="menu-toggle" class="menu-toggle">
    <label for="menu-toggle" class="menu-button" aria-label="Open navigation">☰</label>

    <nav class="sidebar">
        <a href="index.html">Homepage</a>
        <a href="signup.html">Sign Up</a>
        <a href="contact.html">Contact Us</a>
        <a href="signin.html">Sign In</a>
    </nav>

    <!-- Registration Form -->
    <main>
        <section class="form-card">
            <h1>Registration Form</h1>
            <hr>

            <form>
                <table>
                    <tr>
                        <td>Enter Name</td>
                        <td><input type="text" name="name"></td>
                    </tr>

                    <tr>
                        <td>Enter Password</td>
                        <td><input type="password" name="password"></td>
                    </tr>

                    <tr>
                        <td>Enter Address</td>
                        <td><textarea name="address"></textarea></td>
                    </tr>

                    <tr>
                        <td>Select Game</td>
                        <td>
                            <label><input type="checkbox" name="game" value="Hockey"> Hockey</label>
                            <label><input type="checkbox" name="game" value="Football"> Football</label>
                            <label><input type="checkbox" name="game" value="Badminton"> Badminton</label>
                            <label><input type="checkbox" name="game" value="Cricket"> Cricket</label>
                            <label><input type="checkbox" name="game" value="Volleyball"> Volleyball</label>
                        </td>
                    </tr>

                    <tr>
                        <td>Gender</td>
                        <td>
                            <label><input type="radio" name="gender" value="Male" checked> Male</label>
                            <label><input type="radio" name="gender" value="Female"> Female</label>
                        </td>
                    </tr>

                    <tr>
                        <td>Select your age</td>
                        <td>
                            <select name="age">
                                <option value="">Select</option>
                                <option>13</option>
                                <option>14</option>
                                <option>15</option>
                                <option>16</option>
                                <option>17</option>
                                <option>18</option>
                                <option>19</option>
                                <option>20</option>
                                <option>21</option>
                                <option>22</option>
                                <option>23</option>
                                <option>24</option>
                                <option>25</option>
                                <option>26</option>
                                <option>27</option>
                                <option>28</option>
                                <option>29</option>
                                <option>30</option>
                                <option>31</option>
                                <option>32</option>
                                <option>33</option>
                                <option>34</option>
                                <option>35</option>
                                <option>36</option>
                                <option>37</option>
                                <option>38</option>
                                <option>39</option>
                                <option>40</option>
                                <option>41</option>
                                <option>42</option>
                                <option>43</option>
                                <option>44</option>
                                <option>45</option>
                                <option>46</option>
                                <option>47</option>
                                <option>48</option>
                                <option>49</option>
                                <option>50</option>
                                <option>51</option>
                                <option>52</option>
                                <option>53</option>
                                <option>54</option>
                                <option>55</option>
                                <option>56</option>
                                <option>57</option>
                                <option>58</option>
                                <option>59</option>
                                <option>60</option>
                                <option>61</option>
                                <option>62</option>
                                <option>63</option>
                                <option>64</option>
                                <option>65</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>Select Photo</td>
                        <td><input type="file" name="photo"></td>
                    </tr>

                    <tr>
                        <td colspan="2" class="form-buttons">
                            <input type="button" value="Click">
                            <input type="reset" value="Reset">
                            <input type="submit" value="Submit">
                        </td>
                    </tr>
                </table>
            </form>
        </section>
    </main>

</body>
</html>
